[package]
name = "apple-music"
version = "0.1.0"
edition = "2021"
description = "Async client for the Apple Music API (api.music.apple.com)"

[lib]
name = "apple_music"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = "0.9"
reqwest = { version = "0.12.18", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
subsonic = { path = "../subsonic" }
thiserror = "2"
tokio = { version = "1.40.0", features = ["sync", "time"] }

[dev-dependencies]
axum = "0.8.1"
tokio = { version = "1.40.0", features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true

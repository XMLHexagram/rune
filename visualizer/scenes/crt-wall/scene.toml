format = 1
name = "CRT Wall"
license = "MPL-2.0"
description = { zh = "一面没有尽头、堆得高低错落的老电视墙，每台各自跟着拍子闪切换台", en = "An endless wall of old television sets piled every which way, each flicking to another channel on its own beat" }

common = ["wall.wgsl"]
# Covers from the library, for the screens that show one.
covers = true

[state]
file = "state.wgsl"
update = "update.wgsl"

# The whole picture's resolution, per side, stretched to the screen after. 1 draws every pixel;
# for phones 0.6 keeps the scan lines and grilles readable close up, 0.5 softens them.
[render]
scale = 1.0

[[asset]]
id = "plastic"
file = "assets/plastic.png"
# Data, not colour: the normal, how open each spot is and the face's tone.
linear = true
source = "Made by tools/make_textures.py"

# The scopes' trace, small: it is only ever seen on a screen.
[[buffer]]
id = "scope_buf"
scale = 0.3
persistent = true

[[pass]]
shader = "scope.wgsl"
target = "scope_buf"
inputs = ["prev:scope_buf"]

[[pass]]
shader = "view.wgsl"
target = "out"
inputs = ["scope_buf"]

[post]
exposure = 0.0
bloom = { intensity = 0.25, threshold = 1.0, radius = 0.6 }
tonemap = "agx"
grain = 0.025
chromatic = 0.0
vignette = 0.4
contrast = 1.1
saturation = 1.0

# ---- 节拍 ----

[[param]]
id = "conf"
group = { zh = "节拍", en = "Beat" }
label = { zh = "节拍置信度门槛（低于它不踩拍）", en = "Beat confidence needed" }
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "hits"
group = { zh = "节拍", en = "Beat" }
label = { zh = "拍与拍之间的底鼓也算", en = "Kicks between beats" }
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "kick_decay"
group = { zh = "节拍", en = "Beat" }
label = { zh = "每拍冲击的衰减时间", en = "Kick decay" }
unit = "s"
default = 0.2
min = 0.04
max = 1.0
step = 0.01

# ---- 屏幕 ----

[[param]]
id = "share"
group = { zh = "屏幕", en = "Screens" }
label = { zh = "每拍换台的屏幕比例", en = "Share of screens changing channel on a beat" }
default = 0.25
min = 0.02
max = 1.0
step = 0.01

[[param]]
id = "stagger"
group = { zh = "屏幕", en = "Screens" }
label = { zh = "各屏幕换台最多晚多少拍（按四分之一拍对齐）", en = "Most a screen lags the beat (in quarter beats)" }
unit = "beats"
default = 0.75
min = 0.0
max = 2.0
step = 0.25

[[param]]
id = "flash"
group = { zh = "屏幕", en = "Screens" }
label = { zh = "换台时的闪光", en = "Flash on a change of channel" }
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "flash_time"
group = { zh = "屏幕", en = "Screens" }
label = { zh = "闪光落回的时间", en = "How fast the flash fades" }
unit = "s"
default = 0.12
min = 0.02
max = 1.0
step = 0.01

[[param]]
id = "react"
group = { zh = "屏幕", en = "Screens" }
label = { zh = "每拍有反应的屏幕比例（雪花撕裂、图形加速）", en = "Share of screens jolted by a beat (snow torn, figures sped)" }
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "snow"
group = { zh = "屏幕", en = "Screens" }
label = { zh = "雪花的比重", en = "Weight of snow" }
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "scope"
group = { zh = "屏幕", en = "Screens" }
label = { zh = "示波器的比重", en = "Weight of scopes" }
default = 0.35
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "cover"
group = { zh = "屏幕", en = "Screens" }
label = { zh = "封面的比重", en = "Weight of covers" }
default = 1.4
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "now_playing"
group = { zh = "屏幕", en = "Screens" }
label = { zh = "封面里正在播放的那张所占的比例", en = "Share of covers that are the song playing" }
default = 0.3
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "cover_light"
group = { zh = "屏幕", en = "Screens" }
label = { zh = "封面的亮度", en = "Cover brightness" }
default = 0.6
min = 0.1
max = 2.0
step = 0.05

[[param]]
id = "group"
group = { zh = "屏幕", en = "Screens" }
label = { zh = "相邻屏幕同一频道的倾向", en = "How much neighbouring screens share a channel" }
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "off_always"
group = { zh = "屏幕", en = "Screens" }
label = { zh = "常态关掉的屏幕", en = "Screens always off" }
default = 0.2
min = 0.0
max = 0.8
step = 0.05

[[param]]
id = "off"
group = { zh = "屏幕", en = "Screens" }
label = { zh = "安静段落关掉的屏幕（有谱面时）", en = "Screens dark in quiet sections (with a chart)" }
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "brightness"
group = { zh = "屏幕", en = "Screens" }
label = { zh = "屏幕亮度", en = "Screen brightness" }
default = 0.9
min = 0.1
max = 3.0
step = 0.05

[[param]]
id = "persist"
group = { zh = "屏幕", en = "Screens" }
label = { zh = "示波器余辉", en = "Scope persistence" }
unit = "s"
default = 0.12
min = 0.01
max = 1.0
step = 0.01

[[param]]
id = "gaps"
group = { zh = "屏幕", en = "Screens" }
label = { zh = "空着的位置", en = "Empty slots" }
default = 0.04
min = 0.0
max = 0.5
step = 0.01


label = { zh = "整首歌的快慢对速度的影响", en = "The song's pace on speed" }
default = 1.5
min = 0.0
max = 4.0
step = 0.1

[[param]]
id = "moment_pace"
group = { zh = "镜头", en = "Camera" }
label = { zh = "此刻相对整首的快慢对速度的影响", en = "This moment's pace against the song's" }
default = 2.0
min = 0.0
max = 4.0
step = 0.1

[[param]]
id = "view_bars"
group = { zh = "镜头", en = "Camera" }
label = { zh = "每几小节可能换机位", en = "Bars between possible view changes" }
default = 16.0
min = 1.0
max = 64.0
step = 1

[[param]]
id = "view_gap"
group = { zh = "镜头", en = "Camera" }
label = { zh = "两次换机位至少相隔", en = "Least time between view changes" }

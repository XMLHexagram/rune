label = { zh = "侧面镜头的偏转", en = "Side view's turn" }
unit = "°"
default = 30.0
min = 5.0
max = 60.0
step = 1

[[param]]
id = "front"
group = { zh = "镜头", en = "Camera" }
label = { zh = "正面机位的比重", en = "Weight of the front view" }

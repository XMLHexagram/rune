format = 1
name = "Armillary"
license = "MPL-2.0"
description = { zh = "漂浮在太空里的天球仪，玻璃般的环各有各的节奏，光球随音乐呼吸，线稿的多边形在周围随重音亮起", en = "An armillary sphere floating in space, its glassy rings each keeping its own time, its core breathing with the music, polygons drawn in lines round it lit by the accents" }

common = ["world.wgsl"]

[state]
file = "state.wgsl"
update = "update.wgsl"

# The whole picture's resolution, per side, stretched to the screen after: 1 draws every pixel,
# 0.5 a quarter of them.
[render]
scale = 0.75

[[pass]]
shader = "view.wgsl"
target = "out"

# Kept dark: it is watched mostly at night.
[post]
exposure = -0.2
bloom = { intensity = 0.45, threshold = 1.0, radius = 0.7 }
tonemap = "agx"
grain = 0.02
chromatic = 0.0008
vignette = 0.4
contrast = 1.05
saturation = 1.1


# ---- 节拍 ----

[[param]]
id = "conf"
group = { zh = "节拍", en = "Beat" }
label = { zh = "节拍置信度门槛（低于它不踩拍）", en = "Beat confidence needed" }
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "motion"
type = "choice"
group = { zh = "节拍", en = "Beat" }
label = { zh = "环的动法", en = "How the rings move" }
default = 1
options = [{ zh = "自由：各自一直在翻转，被推时换个方向加速翻，再缓回", en = "Free: each always tumbling on its own, pushed to tumble a new way, surging and easing back" }, { zh = "摆：停在原位，被推时晃开或转一整圈再回来", en = "Pendulums: resting in place, swinging or turning a whole turn back to it when pushed" }]

[[param]]
id = "ring_spin"
group = { zh = "节拍", en = "Beat" }
label = { zh = "自由：环自己翻转的快慢（随 BPM）", en = "Free: how fast the rings tumble of themselves (with the tempo)" }
default = 1.0
min = 0.0
max = 4.0
step = 0.05

[[param]]
id = "whirl_time"
group = { zh = "节拍", en = "Beat" }
label = { zh = "环转一整圈的快慢（大环慢些，小环快些）", en = "How long a ring takes over a whole turn (the big ones slower, the small ones quicker)" }
unit = "s"
default = 1.6
min = 0.4
max = 4.0
step = 0.1

[[param]]
id = "sway"
group = { zh = "节拍", en = "Beat" }
label = { zh = "每小节推一个环的力度（摆：晃开的角度；自由：多翻六倍）", en = "How hard a ring is pushed each bar (pendulums: how far it swings out; free: six times that further round)" }
unit = "°"
default = 8.0
min = 0.0
max = 30.0
step = 1.0

[[param]]
id = "flow"
group = { zh = "节拍", en = "Beat" }
label = { zh = "拍与拍之间持续转动、流动的速度（随响度变化）", en = "How fast things keep turning and flowing between beats (faster as it is louder)" }
default = 1.0
min = 0.0
max = 3.0
step = 0.05

# ---- 颜色 ----

[[param]]
id = "follow"
type = "bool"
group = { zh = "颜色", en = "Colour" }
label = { zh = "跟随播放器的主题色（系统强调色、自选颜色或封面主色）", en = "Follow the player's theme colour (the system's accent, the chosen colour or the cover's)" }
default = true

[[param]]
id = "theme"
type = "color"
group = { zh = "颜色", en = "Colour" }
label = { zh = "不跟随播放器时用的主题色；只取它的色相，所有颜色都从它推出来", en = "The theme colour when not following the player; only its hue is taken, and every colour is made from it" }
default = "#007aff"

[[param]]
id = "chroma"
group = { zh = "颜色", en = "Colour" }
label = { zh = "色彩浓淡（0 为黑白）", en = "How colourful (0 is black and white)" }
default = 1.0
min = 0.0
max = 2.0
step = 0.05

# ---- 天球仪 ----

[[param]]
id = "core"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "中心光球的亮度（随响度变化）", en = "The core's light (brighter as it is louder)" }
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "core_look"
type = "choice"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "中心光球的样子", en = "How the core looks" }
default = 5
options = [{ zh = "原样：流动的光纹", en = "As it was: flowing bands of light" }, { zh = "小恒星：中间白热，边缘暗、偏橙，表面颗粒翻动", en = "A little star: white-hot middle, darker orange edge, grained surface boiling" }, { zh = "玻璃灯球：透明球壳里悬着一个小亮点", en = "A glass lamp: a small bright light in a clear globe" }, { zh = "宝石：满身切面的水晶球，光在里面，转动时刻面闪烁", en = "A gem: a ball of crystal cut all over, the light inside it, its facets flashing as it turns" }, { zh = "线稿宝石：只画刻面的棱线，和环一样，中间一个小光点", en = "A gem in lines: only its facets' edges, drawn as the rings are, a small light in its heart" }, { zh = "字符画星球：按明暗用 . : - + = % * # @ 拼成的球，花纹随星球转动", en = "A planet in character art: drawn in . : - + = % * # @ by how bright it is, its markings turning with it" }]

[[param]]
id = "core_kick"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "底鼓时光球鼓起的力度", en = "How hard the core swells on the kick" }
default = 2.5
min = 0.0
max = 8.0
step = 0.1

[[param]]
id = "nebula"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "星云的亮度", en = "The nebula's brightness" }
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "latitude"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "纬度（极轴的倾斜）", en = "Latitude (how the pole tips)" }
unit = "°"
default = 35.0
min = 0.0
max = 90.0
step = 1.0

[[param]]
id = "look"
type = "choice"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "环的样子", en = "How the rings look" }
default = 3
options = [{ zh = "玻璃：半透明金色，发光的边和刻度", en = "Glass: clear gold, glowing edges and ticks" }, { zh = "实物：暗青铜，只被光球照亮", en = "Instrument: dark bronze, lit only by the core" }, { zh = "线稿：细光线，像星图", en = "Lines: fine lines of light, as a star chart" }, { zh = "标记：一颗颗点和十字，近大远小，重音时环上的点依次点亮", en = "Marks: strings of dots and crosses, bigger as they are nearer, an accent lighting a ring's dots" }]

[[param]]
id = "accent"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "多强的拍才点亮（强拍约 0.55–1，弱拍约 0.3–0.5，越响越强）", en = "How strong a beat must be to light (downbeats about 0.55 to 1, weak beats 0.3 to 0.5, stronger when louder)" }
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "lit_beats"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "点亮后暗掉一半要几拍", en = "How many beats a lit ring or shape takes to fade by half" }
unit = "拍"
default = 0.5
min = 0.1
max = 4.0
step = 0.05

[[param]]
id = "layer_bars"
type = "int"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "环和多边形轮流点亮，每几小节换一次", en = "Bars before the rings and the shapes swap turns at lighting" }
default = 4
min = 1
max = 16
step = 1

[[param]]
id = "renew"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "线稿：点亮时换一个新倾角的机会（自由动法下）", en = "Lines: the chance a ring takes a new tilt as it lights (free motion)" }
default = 0.7
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "tick_spec"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "线稿：黄道环刻度随频谱伸长多少", en = "Lines: how far the ecliptic's ticks reach with the spectrum" }
unit = "m"
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "spec_amp"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "线稿：频谱折线环向外起伏多少（每 4 小节换一个环）", en = "Lines: how far the ring drawn as the spectrum reaches out (another ring every four bars)" }
unit = "m"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "bead_gap"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "标记：环上的点之间隔多远", en = "Marks: how far apart the dots round a ring are" }
unit = "m"
default = 0.13
min = 0.05
max = 0.4
step = 0.01

[[param]]
id = "gap_grow"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "标记：越往外的环点隔得越开（0 一样宽）", en = "Marks: how much further apart the dots are round the outer rings (0 the same)" }
default = 0.8
min = 0.0
max = 2.0
step = 0.05

[[param]]
id = "bead_size"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "标记：点的大小", en = "Marks: how big the dots are" }
unit = "m"
default = 0.022
min = 0.005
max = 0.08
step = 0.001

[[param]]
id = "light_reach"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "标记：重音点亮环上多大一段（圈）", en = "Marks: how much of a ring an accent lights (turns)" }
default = 1.0
min = 0.05
max = 1.0
step = 0.05

[[param]]
id = "light_spread"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "标记：点亮铺开要几拍（0 则一下全亮）", en = "Marks: beats for the lighting to spread (0: all at once)" }
unit = "拍"
default = 0.5
min = 0.0
max = 4.0
step = 0.25

[[param]]
id = "light_beats"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "标记：点亮后暗掉一半要几拍", en = "Marks: beats before a lit ring has dimmed by half" }
unit = "拍"
default = 2.0
min = 0.25
max = 8.0
step = 0.25

[[param]]
id = "planet"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "文字星球的半径", en = "The text planet's radius" }
unit = "m"
default = 1.0
min = 0.3
max = 1.4
step = 0.05

[[param]]
id = "text_rows"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "字符画星球有几行字符", en = "Rows of characters across the planet" }
default = 22.0
min = 8.0
max = 48.0
step = 1.0

[[param]]
id = "ring_glow"
group = { zh = "天球仪", en = "Sphere" }
label = { zh = "环的边缘光和柔光", en = "The rings' glowing edges and haze" }
default = 1.0
min = 0.0
max = 3.0
step = 0.05

# ---- 多边形 ----

[[param]]
id = "shapes"
group = { zh = "多边形", en = "Shapes" }
label = { zh = "每次亮起多少个多边形（一批最多 24 个）", en = "How many shapes each accent lights (at most 24 a batch)" }
default = 0.75
min = 0.0
max = 1.0
step = 0.01

[[param]]
id = "shape_size"
group = { zh = "多边形", en = "Shapes" }
label = { zh = "多边形大小", en = "Shape size" }
default = 1.0
min = 0.3
max = 3.0
step = 0.05

[[param]]
id = "shape_glow"
group = { zh = "多边形", en = "Shapes" }
label = { zh = "多边形的亮度", en = "How bright the shapes are" }
default = 1.0
min = 0.0
max = 3.0
step = 0.05

# ---- 镜头 ----

[[param]]
id = "view"
type = "choice"
group = { zh = "镜头", en = "Camera" }
label = { zh = "镜头", en = "Shot" }
default = 0
options = [{ zh = "随段落切换", en = "By section" }, { zh = "略低处推近", en = "From a little below, pushing in" }, { zh = "远景", en = "Far off" }, { zh = "近景穿过环", en = "Close, through the rings" }, { zh = "俯视", en = "From above" }]

[[param]]
id = "lens"
group = { zh = "镜头", en = "Camera" }
label = { zh = "镜头远近（越大越远、视野越窄，透视越弱）", en = "How far back, with a longer lens (higher flattens the perspective)" }
default = 1.8
min = 0.6
max = 3.0
step = 0.05

[[param]]
id = "drift"
group = { zh = "镜头", en = "Camera" }
label = { zh = "镜头内缓慢推近、环绕的速度（0 为静止）", en = "How fast the camera pushes in or circles within a shot (0 still)" }
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "shot_time"
group = { zh = "镜头", en = "Camera" }
label = { zh = "没有谱面时多久换一次镜头", en = "Seconds between shots without a chart" }
unit = "s"
default = 16.0
min = 4.0
max = 60.0
step = 1.0

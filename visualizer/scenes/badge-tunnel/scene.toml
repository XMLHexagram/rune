format = 1
name = "Badge Tunnel"
license = "MPL-2.0"
description = { zh = "在光的隧道里向前穿越，迎面飞来龟甲形的漆徽章，金箔印着家纹", en = "Flying down a tunnel of light past lacquered tortoiseshell badges printed with family crests in gold leaf" }

common = ["badge.wgsl"]

[state]
file = "state.wgsl"
update = "update.wgsl"

# The whole picture's resolution, per side, stretched to the screen after: 1 draws every pixel,
# 0.5 a quarter of them.
[render]
scale = 0.75

[[asset]]
id = "emoji"
file = "assets/emoji.png"
source = "Noto Color Emoji (3D), Apache License 2.0: https://github.com/googlefonts/noto-emoji. Packed by tools/make_emoji.py"

[[asset]]
id = "crests"
file = "assets/crests.png"
# Data, not colour: each crest's signed distance field.
linear = true
source = "Drawn by tools/make_crests.py"

[[pass]]
shader = "tunnel.wgsl"
target = "out"

# Kept dark: it is watched mostly at night.
[post]
exposure = -0.3
bloom = { intensity = 0.4, threshold = 1.2, radius = 0.7 }
tonemap = "agx"
grain = 0.02
chromatic = 0.001
vignette = 0.35
contrast = 1.1
saturation = 1.3


# ---- 节拍 ----

[[param]]
id = "conf"
group = { zh = "节拍", en = "Beat" }
label = { zh = "节拍置信度门槛（低于它不踩拍）", en = "Beat confidence needed" }
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "per_beat"
group = { zh = "节拍", en = "Beat" }
label = { zh = "每拍向前飞多远", en = "How far it flies a beat" }
unit = "m"
default = 6.0
min = 1.0
max = 20.0
step = 0.5

[[param]]
id = "cruise"
group = { zh = "节拍", en = "Beat" }
label = { zh = "没有节拍时的速度", en = "Speed without a beat" }
unit = "m/s"
default = 10.0
min = 0.0
max = 40.0
step = 0.5

[[param]]
id = "surge"
group = { zh = "节拍", en = "Beat" }
label = { zh = "底鼓时向前冲的力度", en = "Surge forward on the kick" }
default = 0.6
min = 0.0
max = 2.0
step = 0.05

[[param]]
id = "beat_turn"
group = { zh = "节拍", en = "Beat" }
label = { zh = "每拍徽章转动的角度", en = "How far the badges turn each beat" }
unit = "rad"
default = 0.35
min = 0.0
max = 1.6
step = 0.05

# ---- 徽章 ----

[[param]]
id = "content"
type = "choice"
group = { zh = "徽章", en = "Badges" }
label = { zh = "飞来的是什么", en = "What flies past" }
default = 0
options = [{ zh = "emoji", en = "Emoji" }, { zh = "家纹徽章", en = "Badges with crests" }]

[[param]]
id = "spin"
group = { zh = "徽章", en = "Badges" }
label = { zh = "emoji 旋转的速度", en = "How fast the emoji turn" }
unit = "rad/s"
default = 0.8
min = 0.0
max = 4.0
step = 0.05

[[param]]
id = "rock"
group = { zh = "徽章", en = "Badges" }
label = { zh = "底鼓时 emoji 多转一下的幅度", en = "How much further the emoji turn on the kick" }
unit = "rad"
default = 0.35
min = 0.0
max = 1.2
step = 0.05

[[param]]
id = "dance"
group = { zh = "徽章", en = "Badges" }
label = { zh = "每个旋律音符有多少 emoji 响应（各自用自己的动作：放大、转圈、左右翻、上下翻、跳起、摇摆）", en = "How many emoji answer each note of the melody (each its own way: swelling, spinning, flipping either way, hopping, rocking)" }
default = 0.3
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "move_time"
group = { zh = "徽章", en = "Badges" }
label = { zh = "一个动作做完要多久", en = "How long a move takes" }
unit = "s"
default = 0.6
min = 0.2
max = 2.0
step = 0.05

[[param]]
id = "note_rise"
group = { zh = "徽章", en = "Badges" }
label = { zh = "没有谱面时：中频高出近来平均多少算一个音符", en = "Without a chart: how far over their late average the mids must rise to make a note" }
default = 0.35
min = 0.05
max = 1.5
step = 0.05

[[param]]
id = "badges"
group = { zh = "徽章", en = "Badges" }
label = { zh = "徽章（或 emoji）多少", en = "How many badges (or emoji)" }
default = 0.75
min = 0.0
max = 1.0
step = 0.01

[[param]]
id = "crowd"
group = { zh = "徽章", en = "Badges" }
label = { zh = "数量跟音乐的程度（段落能量为主，旋律忙时更多；0 为固定数量）", en = "How far the number follows the music (the section's energy, more while the melody is busy; 0 for a fixed number)" }
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "badge_size"
group = { zh = "徽章", en = "Badges" }
label = { zh = "徽章（或 emoji）大小", en = "Badge (or emoji) size" }
default = 1.4
min = 0.3
max = 2.5
step = 0.05

[[param]]
id = "tumble"
group = { zh = "徽章", en = "Badges" }
label = { zh = "不停翻转的徽章的比例（只对徽章）", en = "Share of badges tumbling over (badges only)" }
default = 0.25
min = 0.0
max = 1.0
step = 0.01

[[param]]
id = "palette"
type = "choice"
group = { zh = "徽章", en = "Badges" }
label = { zh = "漆和箔的颜色", en = "Lacquer and leaf" }
default = 0
options = [{ zh = "随段落切换", en = "By section" }, { zh = "黑漆金箔", en = "Black lacquer, gold" }, { zh = "朱漆金箔", en = "Vermilion, gold" }, { zh = "蓝漆银箔", en = "Indigo, silver" }]

[[param]]
id = "cubes"
group = { zh = "徽章", en = "Badges" }
label = { zh = "金箔碎片多少", en = "How many flakes of leaf" }
default = 0.4
min = 0.0
max = 1.0
step = 0.01

[[param]]
id = "sparks"
group = { zh = "徽章", en = "Badges" }
label = { zh = "四角星多少", en = "How many sparkles" }
default = 0.5
min = 0.0
max = 0.8
step = 0.01

# ---- 隧道 ----

[[param]]
id = "inner"
group = { zh = "隧道", en = "Tunnel" }
label = { zh = "中间留空的半径", en = "Clear radius down the middle" }
unit = "m"
default = 1.6
min = 0.5
max = 5.0
step = 0.1

[[param]]
id = "outer"
group = { zh = "隧道", en = "Tunnel" }
label = { zh = "徽章最远离中心多远", en = "How far out the badges reach" }
unit = "m"
default = 8.0
min = 3.0
max = 20.0
step = 0.5

[[param]]
id = "core"
group = { zh = "隧道", en = "Tunnel" }
label = { zh = "远处光芒的亮度（随响度变化）", en = "The core's light (brighter as it is louder)" }
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "lines"
group = { zh = "隧道", en = "Tunnel" }
label = { zh = "速度线多少", en = "How many speed lines" }
default = 0.2
min = 0.0
max = 1.0
step = 0.01

[[param]]
id = "glints"
group = { zh = "隧道", en = "Tunnel" }
label = { zh = "中心附近的闪点多少", en = "Glints round the middle" }
default = 0.25
min = 0.0
max = 1.0
step = 0.01

[[param]]
id = "clouds"
group = { zh = "隧道", en = "Tunnel" }
label = { zh = "紫色光雾", en = "Violet haze" }
default = 1.0
min = 0.0
max = 3.0
step = 0.05

# ---- 镜头 ----

[[param]]
id = "player_colour"
type = "bool"
group = { zh = "颜色", en = "Colour" }
label = { zh = "跟随播放器的主题色（系统强调色、自选颜色或封面主色）：各颜色的明暗、浓淡不变，色相换成它的", en = "Follow the player's theme colour (the system's accent, the chosen colour or the cover's): every colour keeps its lights and darks and how colourful it is, in its hue" }
default = true

[[param]]
id = "chroma"
group = { zh = "颜色", en = "Colour" }
label = { zh = "跟随播放器时的色彩浓淡（0 为黑白）", en = "How colourful, following the player (0 is black and white)" }
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[param]]
id = "view"
type = "choice"
group = { zh = "镜头", en = "Camera" }
label = { zh = "镜头", en = "Shot" }
default = 0
options = [{ zh = "随音乐在几个机位间滑动", en = "Gliding from place to place with the music" }, { zh = "主机位：中轴，光点在三分线上", en = "Down the middle, the core on a third" }, { zh = "低位仰望：emoji 从头顶掠过", en = "Low, looking up, the emoji going by overhead" }, { zh = "贴边横看：隔着隧道看对面", en = "From one side, looking across" }, { zh = "侧翻", en = "Rolled hard" }, { zh = "长焦压缩", en = "A long lens, flattened" }, { zh = "反向看：emoji 远去", en = "Looking back, the emoji going away" }]

[[param]]
id = "focal"
group = { zh = "镜头", en = "Camera" }
label = { zh = "焦距（越小越广）", en = "Focal length (smaller is wider)" }
default = 0.65
min = 0.35
max = 1.5
step = 0.05

[[param]]
id = "shot_bars"
type = "int"
group = { zh = "镜头", en = "Camera" }
label = { zh = "多少小节换一个机位（段落开始时，过了一半就换）", en = "Bars before the camera moves on (at a section, after half as many)" }
default = 16
min = 4
max = 64
step = 1

[[param]]
id = "glide_bars"
group = { zh = "镜头", en = "Camera" }
label = { zh = "滑到下一个机位用几小节", en = "Bars the glide to the next place takes" }
default = 4.0
min = 1.0
max = 8.0
step = 0.5

[[param]]
id = "drift"
group = { zh = "镜头", en = "Camera" }
label = { zh = "停在机位上时缓慢漂移的幅度（0 为不动）", en = "How far the camera drifts while it stays (0 still)" }
default = 1.0
min = 0.0
max = 3.0
step = 0.05

default = true

[[param]]
id = "chroma"
group = { zh = "画面", en = "Look" }
label = { zh = "跟随播放器时的色彩浓淡（0 为黑白）", en = "How colourful, following the player (0 is black and white)" }
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[param]]
id = "theme"
type = "choice"
group = { zh = "画面", en = "Look" }
label = { zh = "白光风格的主题色", en = "Theme of the white light" }
default = 0
options = [{ zh = "随段落切换", en = "By section" }, { zh = "象牙白", en = "Ivory" }, { zh = "金色", en = "Gold" }, { zh = "午夜蓝", en = "Midnight" }, { zh = "玫瑰", en = "Rose" }, { zh = "冰蓝", en = "Ice" }]

[[param]]
id = "theme_fade"

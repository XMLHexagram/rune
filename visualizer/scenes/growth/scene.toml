[[param]]
id = "feel_smooth"
group = { zh = "生长", en = "Growth" }
label = { zh = "听感速度的平滑时间", en = "Smoothing of the pace" }
unit = "s"
default = 4.0
min = 0.5
max = 20.0
step = 0.5

# ---- 塔 ----

[[param]]
id = "girth"
group = { zh = "塔", en = "Tower" }
label = { zh = "塔的粗细", en = "Girth of the tower" }
unit = "m"
default = 5.0
min = 2.0
max = 16.0
step = 0.25

[[param]]
id = "vary"
group = { zh = "塔", en = "Tower" }
label = { zh = "每层粗细的变化", en = "How much each layer's width varies" }
default = 1.0

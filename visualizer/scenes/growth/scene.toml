label = { zh = "每隔几小节可能换机位", en = "Bars between possible view changes" }
default = 8.0
min = 1.0
max = 32.0
step = 1.0

[[param]]
id = "view_chance"
group = { zh = "镜头", en = "Camera" }
label = { zh = "到时换机位的概率", en = "Chance of changing then" }
unit = "%"
default = 40.0
min = 0.0
max = 100.0
step = 1.0

[[param]]
id = "view_gap"

format = 1
name = "Growth"
license = "MPL-2.0"
description = { zh = "白光里向上生长的方块塔，每一拍长一截", en = "A tower of plates growing up into white light, a step on every beat" }

common = ["tower.wgsl"]

[state]
file = "state.wgsl"
update = "update.wgsl"

[[asset]]
id = "concrete"
file = "assets/surface.png"
# Data, not colour: the normal, how open each spot is and the face's tone.
linear = true
source = "Made by tools/make_surface.py"

[[buffer]]
id = "lit"
# Drawn at two thirds of the screen's resolution: the haze and the depth of field hide it, and
# it costs under half as much (for phones). 0.5 is faster still, with a little stair-stepping.
scale = 0.67

[[pass]]
shader = "view.wgsl"
target = "lit"

[[pass]]
shader = "dof.wgsl"
target = "out"
inputs = ["lit"]

[post]
exposure = 0.0
bloom = { intensity = 0.7, threshold = 0.95, radius = 0.8 }
tonemap = "agx"
grain = 0.04
chromatic = 0.0008
vignette = 0.12
contrast = 0.95
saturation = 0.85

# ---- 节拍 ----

[[param]]
id = "conf"
group = { zh = "节拍", en = "Beat" }
label = { zh = "节拍置信度门槛（低于它不踩拍）", en = "Beat confidence needed" }
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "hits"
group = { zh = "节拍", en = "Beat" }
label = { zh = "拍与拍之间的底鼓也带动跳动", en = "Kicks between beats" }
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "kick_decay"
group = { zh = "节拍", en = "Beat" }
label = { zh = "每拍冲击的衰减时间", en = "Kick decay" }
unit = "s"
default = 0.15
min = 0.04
max = 1.0
step = 0.01

[[param]]
id = "glow"
group = { zh = "节拍", en = "Beat" }
label = { zh = "泛光", en = "Glow" }
default = 0.7
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "glow_beat"
group = { zh = "节拍", en = "Beat" }
label = { zh = "每拍的泛光", en = "Glow on the beat" }
default = 0.5
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "pump"
group = { zh = "节拍", en = "Beat" }
label = { zh = "每拍提亮", en = "Brighten on the beat" }
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "zoom"
group = { zh = "节拍", en = "Beat" }
label = { zh = "每拍的轻微拉近", en = "Zoom on the beat" }
default = 0.012
min = 0.0
max = 0.1
step = 0.002

[[param]]
id = "accent_level"
group = { zh = "节拍", en = "Beat" }
label = { zh = "重音门槛", en = "How strong an accent must be" }
default = 0.95
min = 0.5
max = 1.0
step = 0.01

[[param]]
id = "accent_gap"
group = { zh = "节拍", en = "Beat" }
label = { zh = "两次重音闪白至少相隔", en = "Least time between accent flashes" }
unit = "s"
default = 6.0
min = 1.0
max = 30.0
step = 0.5

[[param]]
id = "build_bars"
group = { zh = "节拍", en = "Beat" }
label = { zh = "换段前几小节开始蓄力", en = "Bars of build-up before a section" }
default = 4.0
min = 0.25
max = 16.0
step = 0.25


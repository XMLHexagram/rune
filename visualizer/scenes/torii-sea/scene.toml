format = 1
name = "Torii Sea"
license = "MPL-2.0"
description = { zh = "海上蜿蜒的无限鸟居，浪随音乐拍在礁石上", en = "Endless torii winding over the sea, waves breaking with the music" }

common = ["sea.wgsl"]

[state]
file = "state.wgsl"
update = "update.wgsl"

# The whole picture's resolution, per side, stretched to the screen after: 1 draws every pixel;
# 0.75 keeps the sea's crosses crosses (at 0.5 they blur into dots; the torii, listed per tile of
# the screen, cost a quarter of what they did, which pays for it); 0.5 a quarter of the pixels,
# 0.35 a little soft, below 0.25 the torii's edges turn to steps.
[render]
scale = 0.75

[[pass]]
shader = "view.wgsl"
target = "out"

[post]
exposure = 0.0
bloom = { intensity = 0.4, threshold = 1.0, radius = 0.7 }
tonemap = "agx"
grain = 0.03
chromatic = 0.0
vignette = 0.2
contrast = 1.12
saturation = 1.05

# ---- 节拍 ----

[[param]]
id = "conf"
group = { zh = "节拍", en = "Beat" }
label = { zh = "节拍置信度门槛（低于它不踩拍）", en = "Beat confidence needed" }
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "hits"
group = { zh = "节拍", en = "Beat" }
label = { zh = "拍与拍之间的底鼓也带动跳动", en = "Kicks between beats" }
default = 0.5

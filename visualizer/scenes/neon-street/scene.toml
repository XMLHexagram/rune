default = 4.5
min = 0.0
max = 15.0
step = 0.1

[[param]]
id = "song_pace"
group = { zh = "镜头", en = "Camera" }
label = { zh = "整首歌听起来越快走得越快的程度", en = "Speed follows how fast the song sounds" }
default = 1.5
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "moment_pace"
group = { zh = "镜头", en = "Camera" }
label = { zh = "歌里快慢段落之间速度差别的放大程度", en = "How much faster and slower parts differ" }
default = 2.5
min = 0.0
max = 5.0
step = 0.1

[[param]]
id = "feel_smooth"
group = { zh = "镜头", en = "Camera" }
label = { zh = "速度跟上快慢变化所需的时间", en = "How long the speed takes to follow" }
unit = "s"
default = 4.0
min = 0.5
max = 20.0
step = 0.5

[[param]]
id = "energy_speed"
group = { zh = "镜头", en = "Camera" }
label = { zh = "段落能量影响速度的程度", en = "Speed follows the energy" }
default = 0.3
min = 0.0
max = 2.0
step = 0.05

[[param]]
id = "push"
group = { zh = "镜头", en = "Camera" }
label = { zh = "每拍加速", en = "Push on the beat" }
unit = "m/s"
default = 1.5
min = 0.0
max = 4.0
step = 0.05

[[param]]
id = "ease"
group = { zh = "镜头", en = "Camera" }
label = { zh = "加速后回到巡航的时间", en = "Back to cruise" }
unit = "s"
default = 0.5
min = 0.05
max = 2.0
step = 0.05

[[param]]
id = "accel"
group = { zh = "镜头", en = "Camera" }
label = { zh = "加减速的柔和程度", en = "Smoothness" }
unit = "s"
default = 0.12
min = 0.01
max = 1.0
step = 0.01

[[param]]
id = "build_bars"
group = { zh = "镜头", en = "Camera" }
label = { zh = "换段前几小节开始蓄力", en = "Build-up bars" }
default = 2.0
min = 0.25
max = 8.0
step = 0.25

[[param]]
id = "build"
group = { zh = "镜头", en = "Camera" }
label = { zh = "蓄力时镜头前推（下一段更响时）", en = "Push in before a louder section" }
default = 1.0
min = 0.0
max = 2.0
step = 0.05

# ---- 跳切 ----

[[param]]
id = "same_view"
type = "bool"
group = { zh = "跳切", en = "Cuts" }
label = { zh = "同一类段落用同一个机位", en = "Same view for the same kind of section" }
default = true

[[param]]
id = "cut_bars"

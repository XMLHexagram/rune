default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "bass_glow"
group = { zh = "招牌", en = "Signs" }
label = { zh = "店面和招牌跟持续低音变亮", en = "Glow with the bass" }
default = 0.0
min = 0.0
max = 2.0
step = 0.05

[[param]]
id = "street_things"
group = { zh = "街道", en = "Street" }
label = { zh = "店门口放东西的多少（幟旗、立式看板、自行车）", en = "How many shops have things out front (banners, standing boards, bicycles)" }
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "shrines"
group = { zh = "街道", en = "Street" }
label = { zh = "路边小神社的多少", en = "How many little roadside shrines" }
default = 0.05
min = 0.0
max = 0.3
step = 0.01

[[param]]
id = "arches"
group = { zh = "街道", en = "Street" }
label = { zh = "街区入口有商店街拱门的比例", en = "How many blocks start with the shopping street's arch" }
default = 0.7
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "roof_torii"
group = { zh = "街道", en = "Street" }
label = { zh = "屋顶上有小鸟居的楼有多少", en = "How many buildings have a small torii on the roof" }
default = 0.2
min = 0.0
max = 0.5
step = 0.01

[[param]]
id = "people"
group = { zh = "街道", en = "Street" }
label = { zh = "街上行人的多少", en = "People in the street" }
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "detail"
group = { zh = "街道", en = "Street" }
label = { zh = "小物件画到多远（米，行人再远六成）", en = "How far small things are drawn (m; people 60% further)" }
default = 45.0
min = 15.0
max = 120.0
step = 5.0

[[param]]
id = "palette_spread"
group = { zh = "招牌", en = "Signs" }
label = { zh = "同一街区颜色的分散程度", en = "Colour spread within a district" }
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "sign_saturation"
group = { zh = "招牌", en = "Signs" }
label = { zh = "招牌颜色的饱和度", en = "Sign saturation" }

format = 1
name = "Neon Street"
license = "MPL-2.0"
description = { zh = "夜里的商店街，踩着拍子往前走", en = "A shopping street at night, walked on the beat" }

common = ["glyphs.wgsl", "city.wgsl"]

[state]
file = "state.wgsl"
update = "update.wgsl"

[[asset]]
id = "glyphs"
file = "assets/glyphs.png"
linear = true
source = "Rendered from Noto Sans JP (SIL Open Font License 1.1, assets/OFL.txt) by tools/make_glyphs.py"

# The street is drawn at 0.75 of the screen's size and scaled up: about 1.75 times as fast.
[render]
scale = 0.75

[[buffer]]
id = "street"

[[buffer]]
id = "inked"

[[buffer]]
id = "trail"
persistent = true

[[pass]]
shader = "street.wgsl"
target = "street"

[[pass]]
shader = "ink.wgsl"
target = "inked"
inputs = ["street"]

[[pass]]
shader = "compose.wgsl"
target = "trail"
inputs = ["inked", "prev:trail"]

[[pass]]
shader = "grade.wgsl"
target = "out"
inputs = ["trail"]

[post]
exposure = 0.0
bloom = { intensity = 0.55, threshold = 1.0, radius = 0.7 }
tonemap = "agx"
grain = 0.035
chromatic = 0.0012
vignette = 0.45
contrast = 1.22
saturation = 1.05

# ---- 节拍 ----

[[param]]
id = "conf"
group = { zh = "节拍", en = "Beat" }
label = { zh = "节拍置信度门槛（低于它不踩拍）", en = "Beat confidence needed" }
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "hits"
group = { zh = "节拍", en = "Beat" }
label = { zh = "拍与拍之间的底鼓也带动跳动", en = "Kicks between beats" }
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "kick_decay"
group = { zh = "节拍", en = "Beat" }
label = { zh = "冲击的衰减时间", en = "Kick decay" }
unit = "s"
default = 0.15
min = 0.04
max = 0.6
step = 0.01

[[param]]
id = "shake"
group = { zh = "节拍", en = "Beat" }
label = { zh = "重音时画面抖动的幅度", en = "Shake" }
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "shake_energy"
group = { zh = "节拍", en = "Beat" }
label = { zh = "抖动随响度变化（0 每拍一样）", en = "Shake follows loudness" }
default = 1.0
min = 0.0
max = 1.5
step = 0.05

[[param]]
id = "accent_level"
group = { zh = "节拍", en = "Beat" }
label = { zh = "多重的一下鼓才算重音（0..1）", en = "How hard a hit must be to shake" }
default = 0.97
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "shake_gap"
group = { zh = "节拍", en = "Beat" }
label = { zh = "两次抖动至少相隔", en = "Shortest gap between shakes" }
unit = "s"
default = 10.0
min = 0.5
max = 20.0
step = 0.5

[[param]]
id = "shake_decay"
group = { zh = "节拍", en = "Beat" }
label = { zh = "抖动持续时间", en = "How long a shake lasts" }
unit = "s"
default = 0.35
min = 0.05
max = 1.5
step = 0.05

[[param]]
id = "pump"
group = { zh = "节拍", en = "Beat" }
label = { zh = "每拍整体提亮", en = "Brightness on the kick" }
default = 0.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "zoom"
group = { zh = "节拍", en = "Beat" }
label = { zh = "每拍镜头拉近", en = "Zoom on the kick" }
default = 0.0
min = 0.0
max = 0.2
step = 0.005

# ---- 镜头 ----

[[param]]

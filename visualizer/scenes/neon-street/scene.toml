unit = "%"
default = 30.0
min = 0.0
max = 100.0
step = 1.0

[[param]]
id = "yaw"
group = { zh = "跳切", en = "Cuts" }
label = { zh = "斜看的角度", en = "Side view angle" }
unit = "°"
default = 18.0
min = 0.0
max = 60.0
step = 1.0

[[param]]
id = "yaw_var"
group = { zh = "跳切", en = "Cuts" }
label = { zh = "斜看角度的随机增量", en = "Side view angle spread" }
unit = "°"
default = 10.0
min = 0.0
max = 30.0
step = 1.0

[[param]]
id = "eye"
group = { zh = "跳切", en = "Cuts" }
label = { zh = "街上机位的高度", en = "Street view height" }
unit = "m"
default = 3.0
min = 1.5
max = 6.0
step = 0.1

[[param]]
id = "high"
group = { zh = "跳切", en = "Cuts" }
label = { zh = "招牌上方往前看的概率", en = "High view chance" }
unit = "%"
default = 15.0
min = 0.0
max = 100.0
step = 1.0

[[param]]
id = "high_eye"
group = { zh = "跳切", en = "Cuts" }
label = { zh = "招牌上方机位的高度", en = "High view height" }
unit = "m"
default = 10.0
min = 3.0
max = 20.0
step = 0.5

[[param]]
id = "overview"
group = { zh = "跳切", en = "Cuts" }
label = { zh = "整体俯视的概率", en = "Overview chance" }
unit = "%"
default = 15.0
min = 0.0
max = 100.0
step = 1.0

[[param]]
id = "overview_height"
group = { zh = "跳切", en = "Cuts" }
label = { zh = "俯视的高度", en = "Overview height" }
unit = "m"
default = 45.0
min = 15.0
max = 120.0
step = 1.0

[[param]]
id = "overview_pitch"
group = { zh = "跳切", en = "Cuts" }
label = { zh = "俯视的角度", en = "Overview pitch" }
unit = "°"
default = 55.0
min = 20.0
max = 89.0
step = 1.0

[[param]]
id = "flash"
group = { zh = "跳切", en = "Cuts" }
label = { zh = "跳切闪光", en = "Flash on a cut" }
default = 0.0
min = 0.0
max = 2.0

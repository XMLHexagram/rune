format = 1
name = "Paperclip"
license = "MPL-2.0"
description = { zh = "纸上跳舞的回形针，身后一整片方阵伴舞", en = "A paperclip dancing on its sheet of paper, a field of them dancing behind" }

common = ["clip.wgsl"]

[state]
file = "state.wgsl"
update = "update.wgsl"

# The dancers are drawn at a fraction of the screen's resolution and blown up into big pixels (see
# the buffer below); this is the size of the finished picture.
[render]
scale = 1.0

# The picture in a few big pixels, as a nineties render was: 0.25 of the screen per side (a
# quarter is about 480 by 270 on a 1080p screen). Smaller is chunkier, and cheaper.
[[buffer]]
id = "lo"
scale = 0.25

[[pass]]
shader = "view.wgsl"
target = "lo"

[[pass]]
shader = "pixel.wgsl"
target = "out"
inputs = ["lo"]

# The pixel pass sets the colours itself: no tone mapping and nothing on top.
[post]
exposure = 0.0
bloom = { intensity = 0.0, threshold = 1.0, radius = 0.5 }
tonemap = "none"
grain = 0.0
chromatic = 0.0
vignette = 0.0
contrast = 1.0
saturation = 1.0

# ---- 舞蹈 ----

[[param]]
id = "conf"
group = { zh = "舞蹈", en = "Dance" }
label = { zh = "节拍置信度门槛（低于它不踩拍）", en = "Beat confidence needed" }
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "dance"
group = { zh = "舞蹈", en = "Dance" }
label = { zh = "跳得多用力", en = "How hard they dance" }
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[param]]
id = "chorus"
group = { zh = "舞蹈", en = "Dance" }
label = { zh = "方阵跟着跳的幅度（0 则没有方阵）", en = "How hard the chorus dances (0: no chorus)" }
default = 0.7
min = 0.0
max = 1.5
step = 0.05

[[param]]
id = "wave"
group = { zh = "舞蹈", en = "Dance" }
label = { zh = "离主角每远一格晚多少拍（波浪）", en = "Beats later per unit from the lead (the wave)" }
unit = "beats"
default = 0.06
min = 0.0
max = 0.3
step = 0.01

[[param]]
id = "turn_beats"
group = { zh = "舞蹈", en = "Dance" }
label = { zh = "转身面向镜头用几拍", en = "Beats to turn round to the camera" }
default = 2.0
min = 0.5
max = 8.0
step = 0.5

[[param]]
id = "dizzy"
group = { zh = "舞蹈", en = "Dance" }
label = { zh = "转一圈或后空翻后转晕（@ @）的几率", en = "Chance of getting dizzy (@ @) after a turn or a backflip" }
default = 0.3
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "flip_level"
group = { zh = "舞蹈", en = "Dance" }
label = { zh = "多用力时才会后空翻", en = "How hard they must be dancing to backflip" }
default = 0.6
min = 0.0
max = 1.5
step = 0.05

[[param]]
id = "mood_bars"
group = { zh = "舞蹈", en = "Dance" }
label = { zh = "没有谱面时，表情（情绪）每几小节才可能换（有谱面时随段落换）", en = "Bars a face (the mood) is held at least without a chart (with one it changes with the section)" }
default = 8.0
min = 1.0
max = 32.0
step = 1

[[param]]
id = "face_lock"
group = { zh = "舞蹈", en = "Dance" }
label = { zh = "固定表情（0 自动；1 睁眼、2 >_<、3 ^ ^、4 @ @、5 瞪眼、6 犯困、7 星星、8 闭眼）", en = "Hold one face (0 by the music; 1 open, 2 >_<, 3 ^ ^, 4 @ @, 5 wide, 6 drowsy, 7 stars, 8 shut)" }
default = 0.0
min = 0.0
max = 8.0
step = 1

[[param]]
id = "peak"
group = { zh = "舞蹈", en = "Dance" }
label = { zh = "能量高于它时眼睛变成 >_<", en = "Energy above which the eyes go >_<" }
default = 0.65
min = 0.3
max = 1.1
step = 0.05

# ---- 镜头 ----

[[param]]
id = "view_lock"
group = { zh = "镜头", en = "Camera" }
label = { zh = "固定机位（0 自动；1 正面、2 低角、3 高处远景、4 近旁、5 方阵后方、6 环绕）", en = "Hold one view (0 by the music; 1 front, 2 low, 3 high and far, 4 close beside, 5 behind the chorus, 6 circling)" }
default = 0.0
min = 0.0
max = 6.0
step = 1

[[param]]
id = "ring_bars"
group = { zh = "镜头", en = "Camera" }
label = { zh = "环绕机位转一圈几小节", en = "Bars for the circling view to go round once" }
default = 16.0
min = 2.0
max = 64.0
step = 1

[[param]]
id = "glide"
group = { zh = "镜头", en = "Camera" }
label = { zh = "换机位滑过几小节", en = "Bars to glide to another view" }
default = 2.0
min = 0.25
max = 8.0
step = 0.25

[[param]]
id = "view_bars"
group = { zh = "镜头", en = "Camera" }
label = { zh = "每几小节可能换机位", en = "Bars between possible view changes" }
default = 16.0
min = 1.0
max = 64.0
step = 1

[[param]]
id = "view_gap"
group = { zh = "镜头", en = "Camera" }
label = { zh = "两次换机位至少相隔", en = "Least time between view changes" }
unit = "s"
default = 20.0
min = 2.0
max = 120.0
step = 1

[[param]]
id = "drift"
group = { zh = "镜头", en = "Camera" }
label = { zh = "每个机位里镜头缓慢移动的幅度", en = "How far the camera moves within a view" }
default = 1.0
min = 0.0
max = 2.0
step = 0.1

# ---- 画面 ----

[[param]]
id = "metal"
type = "color"
group = { zh = "画面", en = "Look" }
label = { zh = "回形针的金属色", en = "The clip's metal" }
default = "#8f95c4"

[[param]]
id = "paper"
type = "color"
group = { zh = "画面", en = "Look" }
label = { zh = "纸的颜色", en = "The paper" }
default = "#e2d79a"

[[param]]
id = "player_colour"
type = "bool"
group = { zh = "画面", en = "Look" }
label = { zh = "纸跟随播放器的主题色", en = "Paper in the player's theme colour" }
default = false

[[param]]
id = "background"
type = "color"
group = { zh = "画面", en = "Look" }
label = { zh = "背景色", en = "Background" }
default = "#0c0f16"

[[param]]
id = "shadow"
group = { zh = "画面", en = "Look" }
label = { zh = "纸上影子的深浅", en = "Shadow on the paper" }
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "fade"
group = { zh = "画面", en = "Look" }
label = { zh = "远处隐入黑暗", en = "How fast the distance fades to dark" }
default = 0.08
min = 0.0
max = 1.0
step = 0.01

[[param]]
id = "levels"
group = { zh = "画面", en = "Look" }
label = { zh = "每个颜色通道的色阶数", en = "Levels per colour channel" }
default = 7.0
min = 2.0
max = 32.0
step = 1

[[param]]
id = "exposure"
group = { zh = "画面", en = "Look" }
label = { zh = "曝光", en = "Exposure" }
unit = "EV"
default = 0.0
min = -3.0
max = 3.0
step = 0.1
